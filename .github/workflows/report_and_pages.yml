name: Generate Report & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'quake_exports/**'
      - 'src/mmeq/**'
      - 'data/**'
      - 'generate_figures.py'
      - 'tools/build_figure_data.py'
      - 'paper/main.tex'
      - 'pyproject.toml'
      - 'docs/index.html'

# Least privilege: permissions are granted per job below (test: read;
# build: contents write; deploy: pages + id-token write).

# Queue Pages runs, never cancel a live deploy mid-flight (GitHub's Pages
# template semantics).
concurrency:
  group: "pages"
  cancel-in-progress: false

# Fixed timestamp so matplotlib/LaTeX embed a stable creation date — rebuilt
# figures and the paper PDF then only differ in git when their content actually
# changes, instead of on every run.
env:
  SOURCE_DATE_EPOCH: "1735689600"  # 2025-01-01T00:00:00Z

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest tests/ -v

  build:
    needs: test          # do not regenerate/deploy unless tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: write    # commits regenerated report/figures/paper back to master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build figure input data (report/ CSVs)
        run: python tools/build_figure_data.py

      - name: Generate full report
        # --reuse-risk: build_figure_data.py already computed report/dam_risk_scores.csv
        # in the previous step, so the report consumes it instead of recomputing
        # (spec 003 P2 — dam risk is computed once per CI build).
        run: |
          mkdir -p docs/report
          mmeq report --output docs/report --reuse-risk

      - name: Copy static map
        run: |
          cp -f docs/report/enhanced_earthquake_map.html docs/report/ 2>/dev/null || true
          cp -f enhanced_earthquake_map.html docs/report/ 2>/dev/null || true

      - name: Regenerate paper figures
        run: |
          python generate_figures.py
          mkdir -p docs/report/figures
          cp -f paper/figures/*.png docs/report/figures/

      - name: Build paper PDF
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          working_directory: paper

      - name: Commit report, figures & paper artifacts
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ paper/figures/ paper/main.pdf
          git diff --cached --quiet || git commit -m "docs: update report, figures & paper [skip ci]"
          # master may have moved during the ~8 min build (e.g. a PR merge or the
          # daily data commit) — rebase the artifact commit onto the new tip and
          # retry so a non-fast-forward doesn't fail the whole deploy. Track the
          # push result explicitly: with `push && break` alone, exhausting the
          # retries would exit with the last rebase's status (0), silently
          # losing the artifact commit.
          pushed=0
          for i in 1 2 3; do
            if git push origin master; then pushed=1; break; fi
            git pull --rebase origin master || exit 1
          done
          [ "$pushed" = 1 ] || { echo "push failed after 3 attempts"; exit 1; }

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write       # deploy the Pages artifact
      id-token: write    # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
