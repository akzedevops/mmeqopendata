name: Generate Report & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'quake_exports/**'
      - 'src/mmeq/**'
      - 'data/**'
      - 'generate_figures.py'
      - 'tools/build_figure_data.py'
      - 'paper/main.tex'
      - 'pyproject.toml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Fixed timestamp so matplotlib/LaTeX embed a stable creation date — rebuilt
# figures and the paper PDF then only differ in git when their content actually
# changes, instead of on every run.
env:
  SOURCE_DATE_EPOCH: "1735689600"  # 2025-01-01T00:00:00Z

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest tests/ -v

  build:
    needs: test          # do not regenerate/deploy unless tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build figure input data (report/ CSVs)
        run: python tools/build_figure_data.py

      - name: Generate full report
        run: |
          mkdir -p docs/report
          mmeq report --output docs/report

      - name: Copy static map
        run: |
          cp -f docs/report/enhanced_earthquake_map.html docs/report/ 2>/dev/null || true
          cp -f enhanced_earthquake_map.html docs/report/ 2>/dev/null || true

      - name: Regenerate paper figures
        run: |
          python generate_figures.py
          mkdir -p docs/report/figures
          cp -f paper/figures/*.png docs/report/figures/

      - name: Build paper PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Commit report, figures & paper artifacts
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ paper/figures/ paper/main.pdf
          git diff --cached --quiet || git commit -m "docs: update report, figures & paper [skip ci]"
          git push origin master

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
