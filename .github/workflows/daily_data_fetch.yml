name: Daily Data Fetch and Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # failure-notification step files/updates an issue
  actions: write  # post-push dispatch of the Pages build (see below)

# Never run two fetches at once (overlapping pushes would race); queue instead
# of cancelling so a manual dispatch doesn't kill the scheduled run mid-push.
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # spec 002/004 cutover: the export is a single static Go binary — no
      # Python stack in the daily cron. Behavior parity with the Python
      # exporter is pinned by golden tests and the nightly shadow_go_export
      # diff (3 clean cycles before this cutover). Rollback: restore the
      # setup-python + pip install + `mmeq export` steps from git history.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Build exporter
        run: cd go && go build -o /tmp/mmeq-export ./cmd/mmeq-export

      - name: Run data export
        # Fetches the full-fidelity /api/v2/export route (MMEQ_FETCH_ROUTE
        # defaults to "export"; "v1" remains as a fallback override).
        run: /tmp/mmeq-export export --data-dir data

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quake_exports/
          git diff --cached --quiet || { git commit -m "feat: Update earthquake data"; echo "data_changed=1" >> "$GITHUB_ENV"; }
          # master may have moved while the export ran (e.g. a PR merge or the
          # report workflow's artifact commit) — rebase onto the new tip and
          # retry so a non-fast-forward doesn't fail the whole run. The push
          # result is tracked explicitly: with `push && break` alone, exhausting
          # the retries would exit with the last REBASE's status (0), silently
          # dropping the day's commit and never firing the failure notifier.
          pushed=0
          for i in 1 2 3; do
            if git push origin master; then pushed=1; break; fi
            git pull --rebase origin master || exit 1
          done
          [ "$pushed" = 1 ] || { echo "push failed after 3 attempts"; exit 1; }

      - name: Trigger site rebuild
        # Pushes made with GITHUB_TOKEN deliberately do not create workflow
        # runs, so report_and_pages.yml's push trigger never fires for the
        # daily bot commit — the dashboard silently served stale data for a
        # month (2026-07-06 audit, finding M9). API-initiated dispatches DO
        # create runs, so kick the build explicitly when data changed.
        if: env.data_changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run report_and_pages.yml --ref master --repo "$GITHUB_REPOSITORY"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily data fetch failed"
          body="The scheduled earthquake data fetch failed. See the run log: $RUN_URL"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" --repo "$GITHUB_REPOSITORY"
          else
            gh issue create --title "$title" --body "$body" --repo "$GITHUB_REPOSITORY"
          fi
