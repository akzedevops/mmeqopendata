[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmeq-opendata"
version = "2.0.0"
description = "Myanmar Earthquake Open Data toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aung Khant Zaw", email = "aungkhantzawd@gmail.com"}]

dependencies = [
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "seaborn>=0.12,<1",
    "scikit-learn>=1.3,<2",
    "requests>=2.28,<3",
    "python-dateutil>=2.8,<3",
    "pytz>=2023.3",
    "geopandas>=0.14,<2",
    "contextily>=1.3,<2",
    "folium>=0.14,<1",
    "plotly>=5.15,<7",
    "fpdf2>=2.7,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mmeq = "mmeq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
