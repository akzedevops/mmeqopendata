[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmeq-opendata"
version = "2.1.0"
description = "Myanmar Earthquake Open Data toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aung Khant Zaw", email = "aungkhantzawd@gmail.com"}]

dependencies = [
    "pandas>=2.2,<3",  # resample("ME"/"YE") aliases require pandas>=2.2 (GH#52064)
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "seaborn>=0.12,<1",
    "scikit-learn>=1.3,<2",
    "requests>=2.28,<3",
    "python-dateutil>=2.8,<3",
    "pytz>=2023.3",
    "geopandas>=0.14,<2",
    "contextily>=1.3,<2",
    "folium>=0.14,<1",
    "plotly>=5.15,<8",
    "fpdf2>=2.7,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
mmeq = "mmeq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Self-hosted JS/CSS/font/image assets for folium map output (see
# src/mmeq/visualization/assets.py; populated by tools/fetch_vendor.py).
"mmeq.visualization" = ["vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["advanalysis.py", "adv2analysis.py", "visualizer.py"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) + a subset of pycodestyle (E) errors. Avoid a
# big bang of style churn on a scientific codebase; expand rules over time.
# (Import sorting "I" is deferred — enabling it reorders imports repo-wide; do it
# in a dedicated follow-up so it doesn't bury real findings in churn.)
select = ["F", "E4", "E7", "E9"]
ignore = [
    "E741",  # ambiguous variable names (l, I) — common in math code
    "F401",  # unused imports in __init__ re-exports / optional-dep guards
]

[tool.ruff.lint.per-file-ignores]
# imports interleaved between figure blocks + compact `ax.set_x(...); ax.set_y(...)` (by design)
"generate_figures.py" = ["E402", "E702"]
"tests/*" = ["E402"]
